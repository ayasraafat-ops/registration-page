<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">موقع ذكاء اصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-4xl mx-auto w-full flex flex-col gap-4" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-end">
            <div class="bg-gray-200 text-gray-900 p-3 rounded-lg max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-inner border-t">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="message-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">إرسال</button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
