<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for chat container */
        #chat-container::-webkit-scrollbar {
            width: 8px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-white shadow-xl rounded-2xl flex flex-col h-[85vh] overflow-hidden">

        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex items-center justify-between">
            <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
            <span class="text-sm opacity-80">مدعوم بـ OpenRouter</span>
        </header>

        <!-- Chat Area -->
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 bg-gray-50">
            <!-- Initial Greeting -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm">
                    مرحباً! أنا مساعد ذكي هنا لمساعدتك. كيف يمكنني خدمتك اليوم؟
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="bg-white p-4 border-t border-gray-200">
            <form id="chat-form" class="flex gap-2 relative">
                <input
                    type="text"
                    id="message-input"
                    placeholder="اكتب رسالتك هنا..."
                    class="flex-1 border border-gray-300 rounded-full py-3 px-6 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-700 bg-gray-50"
                    autocomplete="off"
                >
                <button
                    type="submit"
                    id="send-button"
                    class="bg-blue-600 text-white rounded-full px-6 py-2 hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-blue-300 disabled:cursor-not-allowed font-medium"
                >
                    إرسال
                </button>
            </form>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
