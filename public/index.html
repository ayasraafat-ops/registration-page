<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen 3.6 Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">مساعد ذكاء اصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-end">
            <div class="bg-white p-3 rounded-lg rounded-tr-none shadow max-w-[80%]">
                <p class="text-gray-800 message-content">مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white shadow-md border-t">
        <form id="chat-form" class="flex gap-2">
            <input
                type="text"
                id="message-input"
                class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="اكتب رسالتك هنا..."
                required
            />
            <button
                type="submit"
                id="send-button"
                class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </form>
        <div id="error-message" class="text-red-500 text-sm mt-2 hidden"></div>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
