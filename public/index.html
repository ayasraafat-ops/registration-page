<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for chat scroll area */
        #chat-container {
            height: calc(100vh - 160px);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">
    <div class="max-w-4xl mx-auto p-4 flex flex-col h-screen">
        <header class="bg-blue-600 text-white p-4 rounded-t-lg shadow-md text-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </header>

        <main id="chat-container" class="flex-grow bg-white p-4 overflow-y-auto shadow-md border-l border-r border-gray-200">
            <div id="messages" class="space-y-4">
                <!-- Chat messages will be dynamically added here -->
            </div>
        </main>

        <footer class="bg-gray-200 p-4 rounded-b-lg shadow-md flex items-center">
            <input type="text" id="user-input" class="flex-grow p-3 rounded-r-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-l-lg transition duration-200 font-bold px-6">إرسال</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
