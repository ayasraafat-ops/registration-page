<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-grow flex flex-col p-4 overflow-hidden max-w-4xl mx-auto w-full">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-sm border border-gray-200 p-4 overflow-y-auto flex flex-col space-y-4 mb-4">
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg rounded-tr-none px-4 py-2 max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>

        <div class="flex gap-2 relative">
            <input type="text" id="user-input" class="flex-grow border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-6 py-3 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
