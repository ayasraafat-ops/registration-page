<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen 3.6 Plus</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }

        /* Pre-wrap for formatting message lines correctly */
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <header class="bg-blue-600 text-white text-center py-4 shadow-md">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto p-4 flex flex-col overflow-hidden">
        <!-- Error Message Display -->
        <div id="error-container" class="hidden mb-4 p-4 bg-red-100 text-red-700 rounded-lg shadow-sm border border-red-300">
            <p id="error-message" class="text-sm font-medium"></p>
        </div>

        <!-- Chat History -->
        <div id="chat-history" class="flex-1 bg-white rounded-lg shadow-md p-4 mb-4 overflow-y-auto flex flex-col space-y-4">
            <!-- Messages will be appended here via script.js -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-2xl rounded-tr-none px-4 py-2 max-w-[80%] shadow-sm">
                    <p class="message-content">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow-md p-2 flex items-center space-x-2 space-x-reverse">
            <textarea id="user-input" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none h-12" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors h-12" onclick="sendMessage()">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
