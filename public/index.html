<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tajawal Font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-3xl text-center py-6 mb-4">
        <h1 class="text-4xl font-bold text-blue-600">مساعد الذكاء الاصطناعي (Qwen)</h1>
        <p class="text-gray-600 mt-2">تحدث معي، أنا هنا لمساعدتك.</p>
    </header>

    <!-- Chat Container -->
    <main class="w-full max-w-3xl flex-1 bg-white rounded-lg shadow-lg flex flex-col overflow-hidden">

        <!-- Messages Area -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- Example Greeting Message -->
            <div class="flex w-full justify-start">
                <div class="bg-blue-100 text-blue-900 rounded-lg p-3 max-w-[80%] shadow-sm">
                    <p class="message-content">مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Error Message Area -->
        <div id="error-box" class="hidden bg-red-100 text-red-700 p-3 text-center text-sm"></div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-50 border-t border-gray-200 flex gap-2">
            <textarea id="user-input" rows="1" class="flex-1 resize-none border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center font-bold">
                إرسال
            </button>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
