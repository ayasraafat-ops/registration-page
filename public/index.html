<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">موقع ذكاء اصطناعي - Qwen 3.6 Plus</h1>
    </header>

    <main class="flex-grow p-4 overflow-y-auto w-full max-w-4xl mx-auto flex flex-col" id="chat-container">
        <div class="flex justify-start mb-4">
            <div class="bg-white text-gray-800 p-3 rounded-lg rounded-tr-none shadow max-w-[80%] whitespace-pre-wrap">
                أهلاً بك! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-inner border-t">
        <div class="w-full max-w-4xl mx-auto flex gap-2">
            <textarea id="user-input" class="flex-grow p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none h-14" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
