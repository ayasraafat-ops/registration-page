<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 text-center shadow-md">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:px-20 lg:px-40" id="chat-container">
        <!-- Messages will appear here -->
        <div class="flex justify-start mb-4">
            <div class="bg-white border border-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none shadow-sm max-w-[80%] whitespace-pre-wrap">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 p-4 md:px-20 lg:px-40 flex gap-2">
        <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="اكتب رسالتك هنا...">
        <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
