<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-4xl w-full mx-auto" id="chat-container">
        <!-- Messages will be injected here -->
        <div class="flex justify-start mb-4">
            <div class="bg-gray-200 text-gray-800 p-4 rounded-lg rounded-tr-none max-w-[80%] whitespace-pre-wrap shadow-sm">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-t border-gray-200">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2 relative">
            <input
                type="text"
                id="message-input"
                class="flex-1 border border-gray-300 rounded-lg p-3 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-gray-700"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
                required
            >
            <button
                type="submit"
                id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center min-w-[100px]"
            >
                إرسال
            </button>
            <div id="loading-indicator" class="hidden absolute top-[-30px] left-1/2 transform -translate-x-1/2 text-sm text-gray-500 flex items-center gap-2 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
                <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                جاري المعالجة...
            </div>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
