<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-lg shadow-lg flex flex-col h-full max-h-[800px]">
        <div class="bg-blue-600 text-white p-4 rounded-t-lg shadow-sm text-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen Plus)</h1>
        </div>

        <div id="chatBox" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-[80%] whitespace-pre-wrap">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>

        <div class="p-4 border-t flex gap-2">
            <input type="text" id="userInput" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="sendButton" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition duration-150 disabled:opacity-50">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
