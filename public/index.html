<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex justify-between items-center">
        <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4" id="chat-container">
        <!-- Chat messages will be dynamically added here -->
        <div class="flex justify-start">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-3xl shadow-sm">
                مرحباً! أنا مساعدك الذكي المعتمد على نموذج Qwen. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-inner">
        <div class="max-w-4xl mx-auto flex space-x-2 space-x-reverse">
            <textarea id="message-input" rows="1" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none overflow-hidden" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
