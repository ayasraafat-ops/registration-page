<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex-shrink-0">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">محادثة الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full max-w-4xl mx-auto flex flex-col" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-start mb-4">
            <div class="bg-white text-gray-800 rounded-lg p-3 max-w-[85%] md:max-w-[75%] shadow rounded-tr-none">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-md flex-shrink-0">
        <div class="container mx-auto max-w-4xl flex items-center gap-2">
            <textarea
                id="message-input"
                class="flex-1 border border-gray-300 rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 max-h-32"
                rows="1"
                placeholder="اكتب رسالتك هنا..."></textarea>
            <button
                id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 disabled:bg-blue-300 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
