<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-grow p-4 overflow-hidden flex flex-col items-center justify-center">
        <div class="w-full max-w-3xl h-full flex flex-col bg-white rounded-lg shadow-lg border border-gray-200">
            <div id="chat-container" class="flex-grow p-4 overflow-y-auto space-y-4">
                <!-- Chat messages will be dynamically added here -->
            </div>

            <div class="p-4 border-t border-gray-200 bg-gray-50 flex gap-2 rounded-b-lg">
                <input type="text" id="user-input" class="flex-grow p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
                <button id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold">إرسال</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
