<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-4" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-start">
            <div class="bg-white text-gray-800 p-3 rounded-xl rounded-tr-none shadow max-w-[80%] whitespace-pre-wrap">
مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 border-t border-gray-200">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input
                type="text"
                id="message-input"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="اكتب رسالتك هنا..."
                required
                autocomplete="off"
            >
            <button
                type="submit"
                id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors flex items-center justify-center min-w-[80px]"
            >
                إرسال
            </button>
        </form>
    </footer>

    <!-- Error Toast -->
    <div id="error-toast" class="hidden fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded shadow-lg transition-opacity">
        <!-- Error text goes here -->
    </div>

    <script src="script.js"></script>
</body>
</html>
