<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .chat-container {
            height: calc(100vh - 180px);
            overflow-y: auto;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">موقع ذكاء اصطناعي - Qwen 3.6 Plus</h1>
    </header>

    <main class="flex-grow container mx-auto max-w-4xl p-4 flex flex-col">
        <div id="chat-box" class="chat-container bg-white rounded-lg shadow-inner p-4 mb-4 flex flex-col gap-4">
            <!-- Messages will be added here -->
            <div class="flex justify-end">
                <div class="bg-gray-100 p-3 rounded-lg rounded-tr-none max-w-[80%] shadow-sm">
                    <p class="text-gray-800 message-content">مرحباً بك! أنا مساعد ذكاء اصطناعي. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <form id="chat-form" class="flex gap-2 mt-auto">
            <input type="text" id="user-input" class="flex-grow border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
