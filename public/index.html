<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for chat box */
        #chat-box::-webkit-scrollbar {
            width: 8px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        #chat-box::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-50 text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-hidden flex flex-col p-4 sm:p-6 max-w-4xl mx-auto w-full h-full">

        <!-- Chat Messages Container -->
        <div id="chat-box" class="flex-1 bg-white rounded-lg shadow-sm border border-gray-200 p-4 overflow-y-auto mb-4 flex flex-col gap-4">
            <!-- Initial Greeting Message -->
            <div class="flex justify-start">
                <div class="bg-gray-100 text-gray-800 rounded-lg py-3 px-4 max-w-[80%] rounded-tr-none shadow-sm">
                    <p class="message-content">أهلاً بك! أنا مساعد ذكي يعتمد على نموذج Qwen. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-2 flex items-center gap-2">
            <textarea id="user-input" rows="1" class="flex-1 resize-none bg-transparent outline-none p-2 text-gray-800" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-6 py-2 font-medium transition-colors duration-200 flex items-center justify-center">
                إرسال
            </button>
        </div>

        <!-- Error Container -->
        <div id="error-container" class="hidden mt-2 p-3 bg-red-100 text-red-700 border border-red-200 rounded-lg text-sm">
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
