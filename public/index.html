<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl flex flex-col h-[80vh]">

        <!-- Header -->
        <div class="p-4 border-b bg-blue-600 text-white rounded-t-lg">
            <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>

        <!-- Chat History -->
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
            <!-- Messages will be appended here -->
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t flex gap-2">
            <input
                type="text"
                id="message-input"
                class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
            >
            <button
                id="send-button"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium"
            >
                إرسال
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
