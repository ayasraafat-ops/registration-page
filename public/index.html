<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

    <div class="w-full max-w-2xl bg-white rounded-lg shadow-md flex flex-col h-[80vh]">

        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 rounded-t-lg shadow-sm">
            <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي</h1>
        </div>

        <!-- Chat Box -->
        <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4 flex flex-col">
            <!-- Initial Welcome Message -->
            <div class="flex justify-start">
                 <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-[80%] whitespace-pre-wrap">مرحباً بك! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-gray-200 bg-white rounded-b-lg flex gap-2">
            <input type="text" id="userInput" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا...">
            <button id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
