<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4" id="chat-container">
        <!-- Welcome message -->
        <div class="flex justify-start">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-[80%] whitespace-pre-wrap">
مرحباً بك! أنا مساعد ذكاء اصطناعي يعتمد على نموذج Qwen. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white shadow-inner flex gap-2">
        <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
            إرسال
        </button>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
