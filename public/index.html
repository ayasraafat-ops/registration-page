<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        .whitespace-pre-wrap {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen p-4">

    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl flex flex-col h-full max-h-[800px]">

        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 rounded-t-lg flex items-center justify-between">
            <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- Messages will be injected here -->
            <div class="flex justify-end">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-[75%] whitespace-pre-wrap">
مرحباً بك! أنا مساعد ذكي هنا للإجابة على استفساراتك. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t p-4 flex gap-2">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..."
                class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold transition-colors">
                إرسال
            </button>
        </div>

        <div id="error-container" class="hidden bg-red-200 text-red-800 p-2 text-sm text-center"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
