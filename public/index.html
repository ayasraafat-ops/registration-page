<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
            <p class="text-sm opacity-80">مدعوم بنموذج Qwen 3.6 Plus</p>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col h-full max-w-4xl overflow-hidden">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-md p-4 mb-4 overflow-y-auto flex flex-col space-y-4">
            <!-- Messages will be appended here -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-xs md:max-w-md lg:max-w-lg rounded-tr-none">
                    <p>مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-2 flex items-center">
            <input type="text" id="user-input" class="flex-grow p-2 outline-none rounded-r-lg" placeholder="اكتب رسالتك هنا..." autofocus>
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-l-lg transition duration-200 flex-shrink-0">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
