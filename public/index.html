<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 180px);
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">موقع ذكاء اصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-grow container mx-auto p-4 max-w-4xl flex flex-col">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-md p-4 overflow-y-auto mb-4 flex flex-col space-y-4">
            <!-- Messages will be appended here -->
            <div class="flex justify-end">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>

        <form id="chat-form" class="flex space-x-2 space-x-reverse">
            <input type="text" id="message-input" class="flex-grow border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition duration-200">إرسال</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
