<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .chat-container {
            height: calc(100vh - 160px);
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen">

    <header class="bg-white shadow-md py-4">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-2xl font-bold text-gray-800">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <main class="flex-1 container mx-auto p-4 flex flex-col max-w-4xl">
        <div id="chat-messages" class="flex-1 bg-white rounded-lg shadow-sm p-4 overflow-y-auto mb-4 chat-container space-y-4">
            <!-- Welcome message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] rounded-tr-none">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-4">
            <div class="flex space-x-2 space-x-reverse">
                <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
                <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200" onclick="sendMessage()">
                    إرسال
                </button>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
