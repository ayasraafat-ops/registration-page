<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
    </header>

    <main class="flex-grow flex flex-col max-w-4xl w-full mx-auto p-4 sm:p-6 bg-white shadow-lg mt-4 mb-4 rounded-lg overflow-hidden">
        <div id="chat-container" class="flex-grow overflow-y-auto p-4 space-y-4">
            <!-- Messages will be appended here -->
            <div class="flex justify-end">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-xs md:max-w-md shadow whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>

        <form id="chat-form" class="mt-4 flex gap-2 border-t pt-4">
            <input type="text" id="user-input" class="flex-grow p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required>
            <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">إرسال</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
