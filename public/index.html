<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 180px);
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen">

    <header class="bg-white shadow-md py-4 px-6 mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">مساعدك الذكي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto bg-white rounded-lg shadow-md flex flex-col overflow-hidden mb-6">
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Welcome message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] rounded-tr-none shadow-sm">
                    مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="border-t border-gray-200 p-4 bg-gray-50 flex space-x-2 space-x-reverse">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
