<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-4xl mx-auto p-4 md:p-8">

    <header class="bg-white shadow rounded-lg p-4 mb-4 text-center">
        <h1 class="text-2xl font-bold text-gray-800">تطبيق الذكاء الاصطناعي (Qwen Plus)</h1>
    </header>

    <div class="flex-1 bg-white shadow rounded-lg flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- Messages will appear here -->
        </div>

        <div class="p-4 bg-gray-50 border-t border-gray-200">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="message-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="اكتب رسالتك هنا..." required>
                <button type="submit" id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">إرسال</button>
            </form>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
