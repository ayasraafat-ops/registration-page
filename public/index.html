<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق دردشة الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-grow container mx-auto p-4 flex flex-col overflow-hidden max-w-4xl">
        <!-- Messages Area -->
        <div id="chat-messages" class="flex-grow bg-white rounded-lg shadow p-4 overflow-y-auto mb-4 flex flex-col gap-4">
            <!-- Welcome message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] rounded-tr-none">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow p-2 flex gap-2">
            <input type="text" id="user-input" class="flex-grow border rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
