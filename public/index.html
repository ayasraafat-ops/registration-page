<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-white shadow p-4">
        <h1 class="text-2xl font-bold text-center text-gray-800">محادثة مع الذكاء الاصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-grow flex flex-col p-4 max-w-4xl mx-auto w-full overflow-hidden">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow p-4 overflow-y-auto mb-4 flex flex-col space-y-4">
            <!-- Messages will appear here -->
            <div class="flex justify-end">
                <div class="bg-blue-100 text-blue-900 rounded-lg p-3 max-w-3/4">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <form id="chat-form" class="flex gap-2">
            <input type="text" id="message-input" class="flex-grow p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required>
            <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-medium disabled:opacity-50">إرسال</button>
        </form>
    </main>

    <script src="/script.js"></script>
</body>
</html>
