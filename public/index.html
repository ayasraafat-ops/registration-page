<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 160px);
        }
        .message {
            max-width: 80%;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-grow container mx-auto p-4 flex flex-col">
        <!-- Messages Display -->
        <div id="chat-container" class="bg-white rounded-lg shadow-md p-4 overflow-y-auto flex flex-col space-y-4 mb-4">
            <!-- Welcome Message -->
            <div class="flex justify-end">
                <div class="message bg-gray-100 p-3 rounded-lg rounded-tr-none text-gray-800 shadow-sm">
                    مرحباً! أنا مساعدك الذكي المعتمد على نموذج Qwen. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <form id="chat-form" class="mt-auto">
            <div class="flex items-center bg-white rounded-lg shadow-md p-2">
                <textarea
                    id="user-input"
                    rows="1"
                    class="flex-grow p-2 outline-none resize-none bg-transparent"
                    placeholder="اكتب رسالتك هنا..."
                    required></textarea>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-full mr-2 focus:outline-none transition-colors" title="إرسال">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
            <div id="error-message" class="text-red-500 text-sm mt-2 hidden text-center"></div>
        </form>
    </main>

    <script src="/script.js"></script>
</body>
</html>
