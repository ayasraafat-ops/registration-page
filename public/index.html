<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 180px);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center shrink-0">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 w-full max-w-4xl mx-auto bg-white shadow-lg overflow-hidden flex flex-col mt-4 mb-4 rounded-lg">
        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4 flex flex-col">
            <!-- Initial Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-xs md:max-w-md lg:max-w-lg shadow">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-gray-200 bg-gray-50 shrink-0">
            <div class="flex gap-2">
                <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">
                    إرسال
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
