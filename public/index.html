<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-4xl mx-auto w-full flex flex-col space-y-4" id="chat-container">
        <!-- Messages will appear here -->
        <div class="flex justify-start">
             <div class="bg-white p-3 rounded-lg rounded-tr-none shadow max-w-[80%]">
                 <p class="whitespace-pre-wrap">مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p>
             </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-gray-200">
        <div class="max-w-4xl mx-auto flex items-center space-x-2 space-x-reverse">
            <textarea id="user-input" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" rows="2" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition font-bold disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
