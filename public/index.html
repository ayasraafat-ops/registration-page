<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 160px);
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">المساعد الذكي (Qwen-Plus)</h1>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-grow flex justify-center p-4">
        <div class="w-full max-w-3xl bg-white shadow-lg rounded-lg flex flex-col">

            <!-- Chat Messages -->
            <div id="chat-container" class="flex-grow p-4 overflow-y-auto flex flex-col space-y-4">
                <!-- Messages will be appended here -->
                <div class="flex justify-end">
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-xl max-w-[80%] whitespace-pre-wrap">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="border-t p-4 flex gap-2">
                <input type="text" id="user-input" class="flex-grow p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
                <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">إرسال</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
