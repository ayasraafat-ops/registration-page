<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي</h1>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col overflow-hidden max-w-4xl">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-md p-4 overflow-y-auto mb-4 flex flex-col gap-4">
            <!-- Messages will be injected here -->
            <div class="flex justify-end">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-[80%]">
                    مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div id="error-container" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-lg border border-red-300">
            <!-- Error messages will appear here -->
        </div>

        <form id="chat-form" class="flex gap-2 relative">
            <input type="text" id="user-input" class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                إرسال
            </button>
            <div id="loading-indicator" class="hidden absolute left-20 top-3">
                <svg class="animate-spin h-6 w-6 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
