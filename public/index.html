<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        /* Custom scrollbar for chat messages area */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col">
    <header class="bg-white shadow-sm p-4 text-center z-10">
        <h1 class="text-2xl font-bold text-slate-800">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-hidden flex justify-center p-4 md:p-6 w-full max-w-4xl mx-auto">
        <div class="bg-white w-full rounded-2xl shadow-lg border border-slate-100 flex flex-col overflow-hidden">

            <!-- Chat Messages Container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Welcome Message -->
                <div class="flex justify-start">
                    <div class="bg-slate-100 text-slate-800 rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] md:max-w-[75%] shadow-sm">
                        <p class="whitespace-pre-wrap">مرحباً بك! أنا مساعد ذكي يعمل بنموذج Qwen 3.6 Plus. كيف يمكنني مساعدتك اليوم؟</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-white border-t border-slate-100">
                <div class="flex items-end gap-2 relative">
                    <textarea id="user-input" rows="1" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 pr-4 pl-12 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none overflow-hidden min-h-[48px] max-h-[150px] transition-shadow" placeholder="اكتب رسالتك هنا..."></textarea>
                    <button id="send-btn" class="absolute left-2 bottom-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2 w-10 h-10 flex items-center justify-center transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform -rotate-90 rtl:rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
