<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
        }
        .chat-container {
            height: calc(100vh - 160px);
        }
        /* Custom scrollbar for chat container */
        #chat-box::-webkit-scrollbar {
            width: 6px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-grow flex flex-col max-w-4xl w-full mx-auto p-4 md:p-6 overflow-hidden">

        <!-- Error Banner -->
        <div id="error-banner" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <strong class="font-bold">خطأ:</strong>
            <span class="block sm:inline" id="error-message"></span>
        </div>

        <!-- Chat History -->
        <div id="chat-box" class="chat-container bg-white rounded-xl shadow-sm border border-gray-200 p-4 overflow-y-auto flex flex-col space-y-4 mb-4">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-100 text-gray-800 rounded-2xl rounded-tr-sm px-5 py-3 max-w-[85%] sm:max-w-[75%] shadow-sm">
                    <p class="message-content">مرحباً! أنا مساعدك الذكي المعتمد على نموذج Qwen. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-2 sm:p-3 flex items-end space-x-2 space-x-reverse relative">
            <textarea id="user-input" rows="1" class="flex-grow bg-transparent border-0 focus:ring-0 resize-none outline-none py-2 px-3 text-gray-800 max-h-32" placeholder="اكتب رسالتك هنا..." dir="rtl"></textarea>

            <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg p-2 transition-colors duration-200 flex-shrink-0 self-end mb-1 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
        <div class="text-center text-xs text-gray-400 mt-2">
             يمكن للذكاء الاصطناعي أن يخطئ، يرجى التحقق من المعلومات المهمة.
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
