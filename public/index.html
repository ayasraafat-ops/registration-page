<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center text-xl font-bold">
        مساعد الذكاء الاصطناعي (Qwen)
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-4xl mx-auto w-full flex flex-col gap-4" id="chat-container">
        <!-- Messages will appear here -->
        <div class="flex justify-start">
            <div class="bg-white text-gray-800 p-4 rounded-lg rounded-tr-none shadow-sm max-w-[80%]">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-md border-t border-gray-200">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا...">
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
