<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }

        .chat-container {
            height: calc(100vh - 160px);
        }

        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 chat-container" id="chatBox">
        <div class="flex justify-end mb-4">
            <div class="bg-white rounded-lg p-3 shadow max-w-[80%] border border-gray-200">
                <p class="text-gray-800 message-content">مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 border-t border-gray-200">
        <form id="chatForm" class="flex max-w-4xl mx-auto gap-2">
            <input type="text" id="userInput"
                   class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                   placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" id="sendBtn"
                    class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                إرسال
            </button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
