<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen 3.6 Plus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md z-10">
        <h1 class="text-2xl font-bold text-center">موقع ذكاء اصطناعي مدعوم بنموذج Qwen</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4" id="chat-container">
        <!-- Messages will be injected here -->
        <div class="flex w-full justify-start">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-tr-none max-w-[80%] md:max-w-xl shadow">
                مرحباً بك! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-inner border-t border-gray-200 z-10">
        <div class="max-w-4xl mx-auto flex items-center gap-2">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-full transition duration-300 shadow">إرسال</button>
        </div>
    </footer>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
