<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">المساعد الذكي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-grow p-4 overflow-y-auto" id="chat-container">
        <div class="flex flex-col space-y-4 max-w-3xl mx-auto" id="messages">
            <!-- Welcome message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 rounded-lg rounded-tr-none p-3 max-w-[80%] shadow-sm">
                    <p class="whitespace-pre-wrap">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-white border-t border-gray-200">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-grow border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
