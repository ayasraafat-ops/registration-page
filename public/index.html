<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen 3.6 Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen p-4">
    <header class="text-center py-4 bg-white shadow-sm rounded-t-lg">
        <h1 class="text-2xl font-bold text-gray-800">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-grow flex flex-col bg-white shadow-sm border-t-0 rounded-b-lg overflow-hidden max-w-4xl w-full mx-auto">
        <div id="chat-container" class="flex-grow p-4 overflow-y-auto flex flex-col space-y-4">
            <!-- Messages will appear here -->
            <div class="flex justify-start">
                <div class="bg-blue-100 text-gray-800 p-3 rounded-lg max-w-xs md:max-w-md shadow-sm whitespace-pre-wrap">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="border-t border-gray-200 p-4 bg-gray-50 flex items-center">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..."
                class="flex-grow border border-gray-300 rounded-r-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-l-lg transition duration-200 disabled:opacity-50">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
