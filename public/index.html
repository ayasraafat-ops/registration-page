<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center p-4 sm:p-10">

    <div class="w-full max-w-3xl flex-1 bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 shadow-md text-center">
            <h1 class="text-xl font-bold">مساعد ذكاء اصطناعي</h1>
        </div>

        <!-- Chat History -->
        <div id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4 bg-gray-50 flex flex-col">
            <!-- Welcome message -->
            <div class="flex justify-start w-full">
                <div class="max-w-[75%] rounded-2xl p-4 bg-gray-200 text-gray-800 rounded-tr-none shadow-sm">
                    <p class="whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white border-t p-4 flex gap-2">
            <input type="text" id="user-input" class="flex-1 border rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-xl transition duration-200 shadow-sm flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
