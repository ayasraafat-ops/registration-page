<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي</h1>
    </header>

    <!-- Main Chat Container -->
    <main class="flex-1 overflow-hidden flex flex-col max-w-4xl w-full mx-auto p-4">
        <!-- Message List Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 bg-white rounded-lg shadow-inner mb-4 space-y-4">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[75%] rounded-tr-none">
                    مرحباً بك! أنا مساعد ذكي مستند إلى تقنية Qwen. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white p-4 rounded-lg shadow-md flex items-end gap-2">
            <textarea id="message-input" rows="1" class="flex-1 border border-gray-300 rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
