<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen Plus)</h1>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 container mx-auto">
        <div id="chat-container" class="flex flex-col space-y-4 max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-sm min-h-full">
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-gray-200 shadow-sm">
        <div class="container mx-auto max-w-3xl flex gap-2">
            <textarea id="user-input" class="flex-1 resize-none border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="2" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition-colors">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
