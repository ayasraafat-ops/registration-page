<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي - Qwen 3.6 Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي - Qwen 3.6 Plus</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 max-w-4xl w-full mx-auto" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-start mb-4">
            <div class="bg-white text-gray-800 p-3 rounded-lg shadow max-w-[80%] whitespace-pre-wrap">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <!-- Error Display (Hidden by default) -->
    <div id="error-container" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4 max-w-4xl w-full mx-auto mb-2 text-sm" role="alert">
        <p class="font-bold">خطأ</p>
        <p id="error-message"></p>
    </div>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-md border-t border-gray-200">
        <div class="max-w-4xl w-full mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                إرسال
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
