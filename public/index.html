<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg flex flex-col h-[80vh] overflow-hidden">

        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 text-center font-bold text-xl shadow-md z-10">
            مساعد الذكاء الاصطناعي (Qwen Plus)
        </div>

        <!-- Chat Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col">
            <!-- Welcome message -->
            <div class="flex justify-end w-full">
                <div class="bg-blue-100 text-blue-900 rounded-2xl rounded-tr-none px-4 py-3 max-w-[80%] whitespace-pre-wrap">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-50 border-t flex items-center gap-2">
            <textarea id="user-input" class="flex-1 resize-none border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors">
                إرسال
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
