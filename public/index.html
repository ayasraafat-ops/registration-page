<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 text-center text-xl font-bold shadow-md">
        مساعد الذكاء الاصطناعي (Qwen 3.6 Plus)
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 flex justify-center">
        <div class="w-full max-w-3xl flex flex-col gap-4" id="chat-container">
            <!-- Chat messages will go here -->
            <div class="flex justify-start">
                <div class="bg-white text-gray-800 p-4 rounded-xl rounded-tr-none shadow max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-t border-gray-200">
        <div class="max-w-3xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
