<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts - Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-800">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center shrink-0">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto flex flex-col space-y-4" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-end">
            <div class="bg-white rounded-lg p-3 max-w-xs md:max-w-md shadow whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] shrink-0">
        <div class="w-full max-w-4xl mx-auto flex items-end space-x-2 space-x-reverse">
            <textarea id="message-input" rows="1" class="flex-1 bg-gray-100 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none overflow-hidden" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-indigo-600 text-white rounded-lg px-6 py-3 font-semibold hover:bg-indigo-700 transition">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
