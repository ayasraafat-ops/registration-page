<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-1 bg-white rounded-lg shadow-sm p-4 overflow-y-auto mb-4 flex flex-col gap-4">
            <!-- Messages will be injected here -->
            <div class="flex justify-start">
                <div class="bg-blue-100 text-gray-800 p-3 rounded-lg max-w-[80%] shadow-sm">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-3 flex gap-2">
            <textarea id="user-input" class="flex-1 border border-gray-300 rounded-md p-2 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-medium transition-colors">إرسال</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
