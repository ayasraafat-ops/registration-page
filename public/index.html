<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tajawal Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        /* Ensures messages preserve whitespace and wrap correctly */
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen Plus)</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-grow p-4 overflow-y-auto" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex flex-col space-y-4" id="messages">
            <!-- Example system/welcome message -->
            <div class="flex justify-start">
                <div class="bg-white text-gray-800 p-3 rounded-lg rounded-tr-none shadow max-w-[80%] message-content">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>
        <!-- Loading indicator -->
        <div id="loading" class="hidden flex justify-start mt-4">
            <div class="bg-gray-200 text-gray-600 p-3 rounded-lg rounded-tr-none shadow italic max-w-[80%]">جاري التفكير...</div>
        </div>
        <!-- Error message container -->
        <div id="error-container" class="hidden flex justify-start mt-4">
            <div class="bg-red-200 text-red-800 p-3 rounded-lg rounded-tr-none shadow max-w-[80%] message-content" id="error-message"></div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-md border-t border-gray-200">
        <form id="chat-form" class="flex gap-2">
            <input
                type="text"
                id="user-input"
                class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
            >
            <button
                type="submit"
                id="send-btn"
                class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition duration-200 font-bold disabled:opacity-50 disabled:cursor-not-allowed"
            >
                إرسال
            </button>
        </form>
    </footer>

    <!-- App Logic -->
    <script src="script.js"></script>
</body>
</html>
