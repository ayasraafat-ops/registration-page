<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الذكاء الاصطناعي - Qwen 3.6 Plus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow p-4 text-center">
        <h1 class="text-2xl font-bold">تطبيق الذكاء الاصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col items-center">
        <div id="chat-container" class="w-full max-w-4xl bg-white shadow-md rounded-lg flex flex-col overflow-hidden h-full">
            <div id="messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
                <!-- Messages will appear here -->
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 rounded-lg py-2 px-4 max-w-3xl whitespace-pre-wrap">مرحباً! أنا مساعدك الذكي المعتمد على نموذج Qwen. كيف يمكنني مساعدتك اليوم؟</div>
                </div>
            </div>

            <!-- Error Display Area -->
            <div id="error-message" class="hidden bg-red-100 text-red-700 p-2 text-center text-sm">
                <!-- Error text will appear here -->
            </div>

            <!-- Input Area -->
            <div class="border-t border-gray-200 p-4 bg-gray-50 flex gap-2">
                <textarea id="user-input" rows="1" class="flex-1 resize-none border border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="اكتب رسالتك هنا..."></textarea>
                <button id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    إرسال
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-gray-500 text-center p-2 text-sm shadow-inner">
        تم البناء باستخدام نموذج Qwen عبر OpenRouter
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
