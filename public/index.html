<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md p-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col overflow-hidden">
        <!-- Messages Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto bg-white rounded-lg shadow p-4 space-y-4 mb-4 flex flex-col">
            <!-- Initial Greeting -->
            <div class="flex justify-start">
                <div class="bg-gray-100 rounded-lg rounded-tr-none p-3 max-w-[80%] text-gray-800 shadow-sm border border-gray-200">
                    <p class="whitespace-pre-wrap">مرحباً! أنا مساعد الذكاء الاصطناعي. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow p-2 border border-gray-200">
            <form id="chat-form" class="flex gap-2">
                <input
                    type="text"
                    id="message-input"
                    class="flex-1 p-3 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    placeholder="اكتب رسالتك هنا..."
                    autocomplete="off"
                    required
                >
                <button
                    type="submit"
                    id="send-button"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center min-w-[100px]"
                >
                    <span>إرسال</span>
                </button>
            </form>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
