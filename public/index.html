<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <div class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-container">
        <!-- Messages will appear here -->
        <div class="flex justify-start">
            <div class="bg-white text-gray-800 p-3 rounded-lg rounded-tr-none max-w-[80%] shadow-sm">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </div>

    <div class="bg-white p-4 border-t flex items-center gap-2">
        <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500" placeholder="اكتب رسالتك هنا..." />
        <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">إرسال</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
