<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الذكاء الاصطناعي - Qwen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي الذكي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col max-w-4xl h-full overflow-hidden">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-md p-4 overflow-y-auto mb-4 flex flex-col space-y-4 border border-gray-200">
            <!-- Messages will appear here -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-tr-none max-w-[80%] whitespace-pre-wrap">
                    مرحباً! أنا مساعدك الذكي الذي يعمل بنموذج Qwen. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-lg shadow-md flex items-center border border-gray-200">
            <textarea id="user-input" class="flex-grow resize-none border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[50px] max-h-[150px]" placeholder="اكتب رسالتك هنا..." rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
            <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg mr-4 hover:bg-blue-700 transition font-bold disabled:opacity-50 flex-shrink-0">إرسال</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
