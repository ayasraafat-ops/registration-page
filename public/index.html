<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-4xl mx-auto w-full" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="text-center text-gray-500 mt-10" id="welcome-message">
            مرحباً بك! كيف يمكنني مساعدتك اليوم؟
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-gray-200">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="message-input" required
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="اكتب رسالتك هنا...">
            <button type="submit" id="submit-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                إرسال
            </button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
