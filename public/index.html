<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col overflow-hidden">
        <div id="chat-container" class="flex-1 overflow-y-auto bg-white rounded-lg shadow-sm p-4 mb-4 flex flex-col space-y-4">
            <!-- Messages will be appended here -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] rounded-tr-none">
                    مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div id="error-container" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <strong class="font-bold">خطأ:</strong>
            <span class="block sm:inline" id="error-message"></span>
        </div>

        <form id="chat-form" class="flex gap-2">
            <input type="text" id="message-input"
                class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="اكتب رسالتك هنا..." required>
            <button type="submit" id="send-button"
                class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 transition-colors">
                إرسال
            </button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
