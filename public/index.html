<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي (Qwen)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* tailwind gray-100 */
        }
        /* Custom scrollbar for chat box */
        #chat-box::-webkit-scrollbar {
            width: 8px;
        }
        #chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        #chat-box::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">

    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
        <p class="text-sm opacity-80">مدعوم بنموذج Qwen 3.6 Plus</p>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col p-4 max-w-4xl w-full mx-auto">
        <div id="chat-box" class="flex-1 bg-white rounded-lg shadow-sm p-4 overflow-y-auto mb-4 flex flex-col gap-4">
            <!-- Messages will appear here -->
            <div class="flex justify-end">
                <div class="bg-gray-200 text-gray-800 rounded-lg py-2 px-4 max-w-[80%] shadow-sm">
                    مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <form id="chat-form" class="flex gap-2 bg-white p-2 rounded-lg shadow-sm">
            <input
                type="text"
                id="message-input"
                class="flex-1 bg-transparent outline-none px-3 py-2 text-gray-800 placeholder-gray-400"
                placeholder="اكتب رسالتك هنا..."
                required
                autocomplete="off"
            >
            <button
                type="submit"
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition duration-200 flex items-center justify-center min-w-[80px]"
            >
                إرسال
            </button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
