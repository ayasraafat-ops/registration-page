<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen Plus)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-4xl w-full mx-auto" id="chat-container">
        <div class="flex justify-start mb-4">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-xs md:max-w-md lg:max-w-lg shadow">
                مرحباً بك! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-inner border-t">
        <div class="max-w-4xl mx-auto flex items-end">
            <textarea id="user-input" class="w-full border rounded-lg p-2 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="ml-2 mr-2 bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
