<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for chat area */
        #chat-history::-webkit-scrollbar {
            width: 8px;
        }
        #chat-history::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-history::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        #chat-history::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-3xl bg-white rounded-xl shadow-lg flex flex-col h-[80vh] overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="bg-blue-600 text-white p-4 text-center font-bold text-xl shadow-sm z-10">
            مساعد الذكاء الاصطناعي (Qwen)
        </div>

        <!-- Chat History -->
        <div id="chat-history" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-100 text-gray-800 p-4 rounded-2xl rounded-tr-none shadow-sm max-w-[80%]">
                    <p class="whitespace-pre-wrap">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-gray-50 border-t border-gray-200">
            <div class="flex gap-2 relative">
                <textarea id="user-input" rows="1"
                          class="flex-1 resize-none rounded-lg border border-gray-300 p-3 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow"
                          placeholder="اكتب رسالتك هنا..."
                          style="min-height: 50px; max-height: 150px;"></textarea>

                <button id="send-button"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    إرسال
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
