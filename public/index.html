<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tajawal Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 overflow-hidden">
        <div class="w-full max-w-3xl bg-white rounded-lg shadow-lg flex flex-col h-full max-h-[80vh]">

            <!-- Chat History -->
            <div id="chat-history" class="flex-grow p-4 overflow-y-auto flex flex-col space-y-4">
                <!-- Messages will be appended here -->
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 rounded-lg py-2 px-4 max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
                </div>
            </div>

            <!-- Input Form -->
            <div class="p-4 border-t border-gray-200">
                <form id="chat-form" class="flex space-x-2 space-x-reverse">
                    <input type="text" id="user-input" class="flex-grow border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required>
                    <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">إرسال</button>
                </form>
                <div id="error-message" class="text-red-500 text-sm mt-2 hidden"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
