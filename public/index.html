<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .chat-container {
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        /* Message styling */
        .msg-user {
            background-color: #3b82f6;
            color: white;
            border-bottom-left-radius: 0;
        }
        .msg-bot {
            background-color: #e5e7eb;
            color: #1f2937;
            border-bottom-right-radius: 0;
        }
        .msg-error {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            border-bottom-right-radius: 0;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-grow flex justify-center p-4">
        <div class="w-full max-w-3xl bg-white shadow-lg rounded-xl flex flex-col overflow-hidden border border-gray-200">

            <!-- Chat Messages Container -->
            <div id="chat-box" class="chat-container flex-grow p-4 flex flex-col space-y-4">
                <!-- Welcome Message -->
                <div class="flex justify-start">
                    <div class="max-w-xs md:max-w-md lg:max-w-lg px-4 py-2 rounded-2xl msg-bot shadow-sm">
                        <p>مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-gray-50 border-t border-gray-200">
                <form id="chat-form" class="flex space-x-2 space-x-reverse">
                    <input
                        type="text"
                        id="message-input"
                        class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
                        placeholder="اكتب رسالتك هنا..."
                        required
                        autocomplete="off"
                    >
                    <button
                        type="submit"
                        id="send-btn"
                        class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        إرسال
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
