<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محادثة الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">محادثة الذكاء الاصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:px-10 lg:px-20" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-start mb-4">
            <div class="bg-white text-gray-800 p-3 rounded-lg rounded-tr-none shadow max-w-[80%]">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex items-center">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." autofocus>
            <button id="send-button" class="ml-4 mr-2 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
