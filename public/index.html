<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div class="w-full max-w-2xl bg-white shadow-lg rounded-lg overflow-hidden flex flex-col h-[80vh]">
        <div class="bg-blue-600 text-white p-4 text-center font-bold text-xl">
            مساعد الذكاء الاصطناعي (Qwen)
        </div>

        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- Messages will be appended here -->
        </div>

        <div class="p-4 bg-gray-100 border-t border-gray-200">
            <form id="chat-form" class="flex space-x-2 space-x-reverse">
                <input type="text" id="user-input" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
                <button type="submit" id="send-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium">إرسال</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
