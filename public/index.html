<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen3.6-plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col md:w-2/3 lg:w-1/2 overflow-hidden">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-lg p-4 overflow-y-auto mb-4 flex flex-col space-y-4">
            <!-- Messages will be appended here -->
        </div>

        <div class="flex items-center space-x-2 space-x-reverse">
            <textarea id="user-input" class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" rows="2" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-md flex-shrink-0 h-full">إرسال</button>
        </div>
        <div id="error-container" class="text-red-500 mt-2 text-sm hidden text-center font-bold"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
