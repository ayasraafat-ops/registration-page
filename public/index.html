<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-1 overflow-hidden flex flex-col max-w-4xl w-full mx-auto p-4">
        <div id="chat-container" class="flex-1 overflow-y-auto bg-white rounded-lg shadow-sm p-4 space-y-4 mb-4">
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg rounded-tr-none p-3 max-w-[80%]">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="bg-white p-2 rounded-lg shadow-sm flex items-center gap-2 border border-gray-200">
            <input type="text" id="user-input"
                   class="flex-1 p-2 outline-none bg-transparent"
                   placeholder="اكتب رسالتك هنا..."
                   autocomplete="off">
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
