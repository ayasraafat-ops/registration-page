<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 container mx-auto flex flex-col" id="chat-container">
        <!-- Messages will appear here -->
        <div class="flex justify-end mb-4">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-[80%] whitespace-pre-wrap shadow-sm rounded-tl-none">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t">
        <div class="container mx-auto flex gap-2">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
