<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">موقع ذكاء اصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-grow p-4 flex justify-center">
        <div class="w-full max-w-3xl flex flex-col bg-white rounded-lg shadow-lg overflow-hidden">
            <div id="chat-container" class="flex-grow p-4 overflow-y-auto space-y-4 flex flex-col">
                <!-- Messages will be appended here -->
            </div>

            <div class="p-4 bg-gray-100 border-t flex space-x-2 space-x-reverse">
                <input type="text" id="message-input" class="flex-grow p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا...">
                <button id="send-button" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-300">إرسال</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
