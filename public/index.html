<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الدردشة الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 text-center shadow-md">
        <h1 class="text-2xl font-bold">المساعد الذكي Qwen</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-4xl w-full mx-auto" id="chat-container">
        <div class="flex justify-start mb-4">
            <div class="bg-white text-gray-800 p-3 rounded-lg rounded-tr-none shadow max-w-[80%] whitespace-pre-wrap">مرحباً! أنا المساعد الذكي، كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t shadow-inner">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." class="flex-1 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" autocomplete="off">
            <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
