<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 180px);
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-800">
    <header class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">موقع ذكاء اصطناعي (Qwen 3.6 Plus)</h1>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto p-4 flex flex-col h-full relative">
        <div id="chat-container" class="flex-grow bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 overflow-y-auto space-y-4 flex flex-col">
            <!-- Messages will appear here -->
            <div class="text-center text-gray-400 mt-10">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>

        <div id="loading" class="hidden absolute bottom-24 left-1/2 transform -translate-x-1/2 text-sm text-indigo-600 bg-white px-4 py-2 rounded-full shadow-md border border-indigo-100 flex items-center space-x-2 space-x-reverse">
            <svg class="animate-spin h-4 w-4 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>جاري التفكير...</span>
        </div>

        <form id="chat-form" class="flex gap-2">
            <input type="text" id="user-input" class="flex-grow border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-shadow" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" id="send-button" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-6 py-3 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-sm">
                إرسال
            </button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
