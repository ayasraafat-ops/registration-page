<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-3xl mx-auto p-4 md:p-6 bg-gray-100">

    <header class="bg-white shadow-sm rounded-t-xl p-4 mb-2 flex justify-between items-center z-10">
        <h1 class="text-xl md:text-2xl font-bold text-gray-800">مساعد الذكاء الاصطناعي</h1>
        <span class="text-sm text-gray-500">مدعوم بواسطة Qwen 3.6 Plus</span>
    </header>

    <main class="flex-1 overflow-y-auto bg-white shadow-sm p-4 flex flex-col gap-4 rounded-b-xl relative" id="chat-container">
        <!-- Welcome Message -->
        <div class="flex justify-start w-full">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-2xl rounded-tr-none max-w-[85%] md:max-w-[75%] shadow-sm">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Loading Indicator -->
    <div id="loading-indicator" class="hidden text-center text-gray-500 p-2 text-sm my-1">
       جاري التفكير...
    </div>

    <!-- Error Bubble (hidden initially) -->
     <div id="error-bubble" class="hidden justify-center w-full mb-2">
            <div class="bg-red-100 text-red-700 p-2 rounded-xl text-sm border border-red-200" id="error-text">
            </div>
    </div>


    <footer class="mt-4 w-full">
        <form id="chat-form" class="flex gap-2 bg-white p-2 rounded-xl shadow-sm border border-gray-200 relative">
            <textarea
                id="message-input"
                class="flex-1 bg-transparent p-2 outline-none resize-none min-h-[44px] max-h-[120px] text-gray-800"
                placeholder="اكتب رسالتك هنا..."
                rows="1"
            ></textarea>
            <button
                type="submit"
                id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center self-end h-[44px]"
            >
                إرسال
            </button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
