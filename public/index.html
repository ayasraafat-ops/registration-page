<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي (Qwen)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center shrink-0">
        <h1 class="text-2xl font-bold">المساعد الذكي - Qwen 3.6 Plus</h1>
    </header>

    <!-- Chat History -->
    <main id="chat-container" class="flex-grow p-4 overflow-y-auto w-full max-w-4xl mx-auto flex flex-col gap-4">
        <!-- Messages will be injected here -->
        <div class="flex justify-end w-full">
            <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] shadow">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 border-t shrink-0">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-grow border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-bold shadow disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
        </div>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
