<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-4xl w-full mx-auto" id="chat-container">
        <div class="flex justify-end mb-4">
            <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%]">
                مرحباً! كيف يمكنني مساعدتك اليوم؟
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 shadow-inner border-t">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 border rounded-lg p-2 focus:outline-none focus:border-blue-500" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition" onclick="sendMessage()">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
