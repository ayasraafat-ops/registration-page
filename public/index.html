<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 flex justify-between items-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4" id="chat-container">
        <!-- Initial Welcome Message -->
        <div class="flex justify-end w-full">
            <div class="bg-white rounded-lg p-3 shadow max-w-[80%] md:max-w-[70%]">
                <p class="text-gray-800 whitespace-pre-wrap">مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-md border-t border-gray-200">
        <form id="chat-form" class="flex gap-2 max-w-4xl mx-auto">
            <input
                type="text"
                id="user-input"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-gray-50 text-gray-900"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
                required
            >
            <button
                type="submit"
                id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
            >
                إرسال
            </button>
        </form>
        <!-- Error Message Container (Hidden by default) -->
        <div id="error-container" class="hidden mt-2 text-red-600 text-sm text-center font-medium max-w-4xl mx-auto"></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
