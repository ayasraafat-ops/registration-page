<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center bg-gray-100 p-4">
    <div class="w-full max-w-2xl bg-white shadow-md rounded-lg flex flex-col h-[80vh]">
        <div class="bg-blue-600 text-white py-4 px-6 rounded-t-lg flex justify-between items-center">
            <h1 class="text-xl font-bold">محادثة ذكاء اصطناعي (Qwen)</h1>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages will be injected here -->
        </div>

        <div class="border-t p-4 flex gap-2">
            <input type="text" id="user-input" class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-colors">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
