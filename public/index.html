<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white py-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">المساعد الذكي (Qwen-Plus)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 w-full max-w-4xl mx-auto flex flex-col space-y-4" id="chat-container">
        <!-- Messages will be appended here -->
    </main>

    <footer class="bg-white py-4 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <div class="max-w-4xl mx-auto flex px-4">
            <textarea id="message-input" rows="1" class="flex-1 resize-none rounded-r-lg border border-gray-300 p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-l-lg font-bold transition-colors">إرسال</button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
