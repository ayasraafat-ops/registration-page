<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الذكاء الاصطناعي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better appearance */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-blue-600 text-white p-4 shadow-md z-10 text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen3.6-Plus)</h1>
    </header>

    <main class="flex-1 overflow-hidden flex justify-center p-4">
        <div class="w-full max-w-4xl bg-white rounded-lg shadow-lg flex flex-col overflow-hidden">
            <!-- Error Banner -->
            <div id="error-banner" class="hidden bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p id="error-message" class="text-sm"></p>
            </div>

            <!-- Chat Container -->
            <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4">
                <!-- Messages will be appended here by script.js -->
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] break-words">
                        مرحباً! كيف يمكنني مساعدتك اليوم؟
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="bg-gray-50 p-4 border-t border-gray-200">
                <form id="chat-form" class="flex gap-2">
                    <textarea
                        id="user-input"
                        class="flex-1 border border-gray-300 rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        rows="2"
                        placeholder="اكتب رسالتك هنا..."
                        required></textarea>
                    <button
                        type="submit"
                        id="send-button"
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition duration-200 self-end">
                        إرسال
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
