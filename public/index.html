<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي الذكي</h1>
    </header>

    <!-- Chat Area -->
    <main class="flex-grow container mx-auto max-w-4xl p-4 flex flex-col bg-white shadow-lg mt-4 mb-4 rounded-lg overflow-hidden">
        <div id="chatBox" class="flex-grow overflow-y-auto p-4 space-y-4">
            <!-- Initial AI message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-[80%] shadow-sm">
                    <p style="white-space: pre-wrap;">مرحباً بك! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t p-4 bg-gray-50 flex items-center gap-3 rounded-b-lg">
            <textarea id="userInput" rows="1" placeholder="اكتب رسالتك هنا..." class="flex-grow p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
            <button id="sendBtn" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-indigo-700 transition disabled:opacity-50">إرسال</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
