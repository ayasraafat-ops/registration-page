<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold text-center">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4" id="chat-container">
        <!-- Messages will appear here -->
        <div class="flex justify-start">
            <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-3xl shadow">
                <p class="message-content">مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-gray-300 shadow-inner">
        <form id="chat-form" class="flex space-x-2 space-x-reverse max-w-4xl mx-auto">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required autocomplete="off">
            <button type="submit" id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow">
                إرسال
            </button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
