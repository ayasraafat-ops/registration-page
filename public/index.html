<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        #chat-container {
            height: calc(100vh - 160px);
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
    </header>

    <main class="flex-grow container mx-auto p-4 max-w-4xl flex flex-col">
        <div id="chat-container" class="bg-white rounded-lg shadow-md p-4 overflow-y-auto mb-4 flex flex-col space-y-4">
            <div class="flex justify-start">
                <div class="bg-blue-100 text-blue-900 rounded-lg rounded-tr-none p-3 max-w-[80%]">
                    مرحباً! كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="mt-auto">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="message-input" class="flex-grow border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button type="submit" id="send-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200">
                    إرسال
                </button>
            </form>
            <div id="error-message" class="text-red-500 mt-2 text-sm hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
