<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .whitespace-pre-wrap {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-600 text-white py-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-grow p-4 sm:p-6 lg:p-8 flex justify-center">
        <div class="w-full max-w-3xl bg-white shadow-lg rounded-xl flex flex-col overflow-hidden border border-gray-200">

            <div id="chat-container" class="flex-grow p-4 overflow-y-auto flex flex-col space-y-4 bg-gray-50 h-96">
                <!-- Messages will be appended here -->
                <div class="flex justify-end">
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-tl-none max-w-[80%] whitespace-pre-wrap shadow-sm text-sm sm:text-base">
                        مرحباً! كيف يمكنني مساعدتك اليوم؟
                    </div>
                </div>
            </div>

            <div class="p-3 border-t border-gray-200 bg-white flex items-center gap-2">
                <input type="text" id="user-input" class="flex-grow border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="اكتب رسالتك هنا..." />
                <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none flex-shrink-0">
                    إرسال
                </button>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
</body>
</html>
