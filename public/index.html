<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">موقع ذكاء اصطناعي (Qwen3.6-plus)</h1>
    </header>

    <main class="flex-grow p-4 overflow-hidden flex flex-col container mx-auto max-w-4xl bg-white shadow-lg mt-4 mb-4 rounded-lg">
        <div id="chat-container" class="flex-grow overflow-y-auto p-4 space-y-4 flex flex-col">
            <!-- Messages will appear here -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg max-w-[80%] whitespace-pre-wrap">
                    مرحباً! أنا مساعد ذكاء اصطناعي. كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <div class="border-t p-4 flex gap-2">
            <input type="text" id="user-input" class="flex-grow border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." />
            <button id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition duration-300 font-bold">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
