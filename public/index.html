<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 flex flex-col overflow-hidden max-w-4xl">
        <div id="chat-box" class="flex-grow bg-white rounded-lg shadow-md p-4 mb-4 overflow-y-auto flex flex-col gap-4">
            <!-- Messages will be appended here -->
            <div class="flex justify-end">
                <div class="bg-blue-100 text-blue-900 rounded-lg p-3 max-w-[80%] rounded-tr-none">
                    <p class="message-content">أهلاً بك! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-4">
            <form id="chat-form" class="flex gap-2">
                <input type="text" id="message-input"
                    class="flex-grow border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="اكتب رسالتك هنا..." required>
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    إرسال
                </button>
            </form>
            <div id="error-message" class="text-red-500 text-sm mt-2 hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
