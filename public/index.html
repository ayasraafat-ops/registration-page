<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-lg shadow-xl flex flex-col h-[80vh]">
        <div class="bg-blue-600 text-white p-4 rounded-t-lg shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages will be added here -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-lg rounded-tr-none max-w-[80%] whitespace-pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
            </div>
        </div>

        <div class="p-4 border-t border-gray-200">
            <div id="error-message" class="text-red-500 text-sm mb-2 hidden"></div>
            <form id="chat-form" class="flex space-x-2 space-x-reverse">
                <input type="text" id="user-input" class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" placeholder="اكتب رسالتك هنا..." required>
                <button type="submit" id="send-button" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">إرسال</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
