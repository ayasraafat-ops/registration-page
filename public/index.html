<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-2xl bg-white rounded-lg shadow-md flex flex-col h-full overflow-hidden">
        <div class="bg-blue-600 text-white p-4 text-center font-bold text-xl">
            مساعد الذكاء الاصطناعي (Qwen)
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages will appear here -->
        </div>

        <div class="p-4 border-t border-gray-200 bg-gray-50 flex items-center gap-2">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا...">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
