<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-8 max-w-4xl w-full mx-auto" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-start mb-4">
            <div class="bg-gray-200 text-gray-800 p-4 rounded-lg rounded-tr-none max-w-[80%] md:max-w-[70%]">
                <p>مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-gray-200">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالتك هنا...">
            <button id="send-btn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
