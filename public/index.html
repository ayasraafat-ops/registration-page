<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center">

    <div class="w-full max-w-3xl h-full sm:h-5/6 flex flex-col bg-white shadow-xl sm:rounded-lg overflow-hidden">

        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 text-center font-bold text-xl shadow-md z-10">
            مساعد الذكاء الاصطناعي
        </header>

        <!-- Chat History -->
        <main id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- Messages will be appended here -->
            <div class="flex justify-end">
                <div class="bg-gray-200 text-gray-800 rounded-lg rounded-tr-none px-4 py-2 max-w-[80%] whitespace-pre-wrap">
مرحباً بك! أنا مساعد الذكاء الاصطناعي الخاص بك، كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </main>

        <!-- Error Container -->
        <div id="error-container" class="hidden px-4 py-2 bg-red-100 text-red-700 text-sm border-t border-red-200">
        </div>

        <!-- Chat Input Area -->
        <footer class="bg-gray-50 border-t border-gray-200 p-4">
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..."
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <button id="send-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 disabled:opacity-50">
                    إرسال
                </button>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
