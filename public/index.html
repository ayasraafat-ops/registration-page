<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="flex-grow container mx-auto p-4 flex flex-col h-[calc(100vh-80px)] max-w-4xl">
        <div id="chatBox" class="flex-grow bg-white rounded-lg shadow-md p-4 overflow-y-auto mb-4 flex flex-col space-y-4">
            <!-- Welcome Message -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg p-3 max-w-[80%] rounded-tr-none">
                    <p class="whitespace-pre-wrap">مرحباً بك! أنا مساعد ذكي أعمل بنموذج Qwen. كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-lg shadow-md p-4 flex space-x-2 rtl:space-x-reverse">
            <textarea id="userInput" class="flex-grow border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none h-14" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
            <button id="sendButton" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                إرسال
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
