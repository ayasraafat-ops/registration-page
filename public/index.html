<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
        .message-content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-100">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center">
        <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي (Qwen)</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-4" id="chat-container">
        <!-- Messages will be appended here -->
        <div class="flex justify-start">
            <div class="bg-white text-gray-800 rounded-lg p-3 max-w-[80%] md:max-w-[70%] shadow message-content">مرحباً! كيف يمكنني مساعدتك اليوم؟</div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-md border-t border-gray-200">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input
                type="text"
                id="message-input"
                class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                placeholder="اكتب رسالتك هنا..."
                autocomplete="off"
            >
            <button
                id="send-button"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors"
            >
                إرسال
            </button>
        </div>
        <div id="error-message" class="text-red-500 text-sm mt-2 hidden text-center"></div>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
