<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي - Qwen 3.6 Plus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
    </style>
</head>
<body class="flex flex-col h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md text-center shrink-0">
        <h1 class="text-2xl font-bold">مساعد ذكاء اصطناعي - Qwen</h1>
    </header>

    <!-- Chat Container -->
    <main class="flex-1 overflow-y-auto p-4 flex flex-col items-center">
        <div id="chat-box" class="w-full max-w-3xl flex flex-col space-y-4 pb-4">
            <!-- Messages will appear here -->
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white p-4 shadow-[0_-2px_10px_rgba(0,0,0,0.1)] shrink-0 flex justify-center">
        <div class="w-full max-w-3xl flex gap-2">
            <textarea id="user-input" class="flex-1 border border-gray-300 rounded-lg p-3 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" rows="1" placeholder="اكتب رسالتك هنا..."></textarea>
            <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 self-end">
                إرسال
            </button>
        </div>
    </footer>

    <script src="/script.js"></script>
</body>
</html>
