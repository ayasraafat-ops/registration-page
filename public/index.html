<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع ذكاء اصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-2xl bg-white rounded-lg shadow-lg overflow-hidden flex flex-col h-[80vh]">
        <div class="bg-blue-600 text-white p-4 text-center">
            <h1 class="text-2xl font-bold">مساعد الذكاء الاصطناعي</h1>
        </div>

        <div id="chat-container" class="flex-1 p-4 overflow-y-auto space-y-4">
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 rounded-lg rounded-tr-none py-2 px-4 max-w-[70%]">
                    <p style="white-space: pre-wrap">مرحباً! كيف يمكنني مساعدتك اليوم؟</p>
                </div>
            </div>
        </div>

        <div class="p-4 bg-gray-100 border-t border-gray-200 flex items-center">
            <input type="text" id="user-input" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="اكتب رسالتك هنا...">
            <button id="send-button" class="mr-2 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-600">
                إرسال
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
